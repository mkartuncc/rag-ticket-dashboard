name: Deploy Lambda Functions

on:
  push:
    branches: [main]
    paths:
      - 'lambda/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --target lambda/package -r lambda/requirements.txt

      - name: Build zip
        run: |
          cd lambda/package && zip -qr ../lambda_package.zip .
          cd ..
          zip -q lambda_package.zip \
            intake_handler.py \
            evaluator_handler.py \
            ingest_handler.py \
            rag_pipeline.py \
            prompt_renderer.py \
            github_helper.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload to S3
        run: |
          aws s3 cp lambda/lambda_package.zip s3://rag-ticket/lambda_package.zip

      - name: Update Lambda functions
        run: |
          aws lambda update-function-code \
            --function-name rag-intake \
            --s3-bucket rag-ticket --s3-key lambda_package.zip
          aws lambda update-function-code \
            --function-name rag-evaluator \
            --s3-bucket rag-ticket --s3-key lambda_package.zip
          aws lambda update-function-code \
            --function-name rag-ingest \
            --s3-bucket rag-ticket --s3-key lambda_package.zip
